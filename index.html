<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎧 한글 받아쓰기</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/questions.js" defer></script>
    <script src="js/app.js" defer></script>
</head>

<body>
    <!-- 배경음악 -->
    <audio id="backgroundMusic" preload="auto" loop>
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <!-- 시작 오버레이: 사용자 클릭으로 음악 재생을 허용받기 위한 첫 화면 -->
    <div id="introOverlay" class="intro-overlay" role="dialog" aria-modal="true" aria-label="시작하기">
        <button type="button" class="btn-start" data-action="enter-app" autofocus>▶ 시작하기</button>
    </div>

    <main class="container">
        <!-- 시작 화면 -->
        <section id="startScreen" class="screen">
            <h1>🎧 한글 받아쓰기</h1>
            <p class="info-text">원하는 난이도를 선택하여 타자 연습을 시작하세요!</p>

            <div class="difficulty-list">
                <button type="button" class="btn-easy" data-action="start-game" data-difficulty="easy">🟢 쉬움 (단어 10문제)</button>
                <button type="button" class="btn-normal" data-action="start-game" data-difficulty="normal">🔵 보통 (어구 13문제)</button>
                <button type="button" class="btn-hard" data-action="start-game" data-difficulty="hard">🔴 어려움 (문장 15문제)</button>
            </div>

            <div class="button-group">
                <button type="button" class="btn-music" id="musicToggle" data-action="toggle-music" title="음악 재생/일시정지">🔇 음악 OFF</button>
                <button type="button" class="btn-exit" data-action="exit">프로그램 종료</button>
            </div>
        </section>

        <!-- 게임 화면 -->
        <section id="gameScreen" class="screen hidden">
            <h2 id="difficultyTitle">난이도</h2>
            <div id="progressInfo">문제 1 / 10</div>

            <div>
                <button type="button" class="btn-action" data-action="play-voice">🔊 소리 듣기</button>
                <button type="button" class="btn-listen" data-action="play-voice">🔄 다시 듣기</button>
            </div>

            <input type="text" id="userInput" placeholder="들린 소리를 타이핑하세요" autocomplete="off">

            <div id="hintArea"></div>

            <div>
                <button type="button" class="btn-primary" data-action="check-answer">정답 확인</button>
                <button type="button" class="btn-hint" data-action="show-hint">💡 힌트</button>
                <button type="button" class="btn-exit" data-action="go-main">메인으로</button>
            </div>

            <div id="result"></div>
        </section>

        <!-- 결과 화면 -->
        <section id="scoreScreen" class="screen hidden">
            <h1>🎉 받아쓰기 결과</h1>
            <div class="score-box">
                <div id="finalScore">100점</div>
                <div id="scoreDetail">10문제 중 10문제 정답</div>
            </div>

            <div id="perfectMessage"></div>
            <div id="wrongAnswers"></div>

            <button type="button" class="btn-primary" data-action="go-main">🏠 메인으로</button>
        </section>
    </main>
</body>
</html>
